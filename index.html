<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6D3FD1"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="entel.png">
<title>Referidos Entel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body>

<div id="login" class="login"><div class="login-box">
  <img src="entel.png" class="logo" alt="Entel"><h2>Referidos</h2>
  <input type="password" id="pass" placeholder="Tu contraseña" autocomplete="current-password">
  <button class="btn" id="b-login">Ingresar</button><div id="l-err" class="err"></div>
</div></div>

<div id="app" hidden>
<header><img src="entel.png" alt=""><div><b id="h-name"></b><small id="h-sync"></small></div>
  <button class="ico" id="b-sync" aria-label="Actualizar">⟳</button><button class="ico" id="b-out" aria-label="Salir">⎋</button></header>
<main>
  <div id="pend" class="pendbar" hidden></div>
  <section id="v-reg" class="view on">
    <form id="f" class="panel"><h2 id="f-title">Nuevo referido</h2>
      <label>Celular<input id="cel" inputmode="numeric" maxlength="12" placeholder="Ej. 70012345" required></label>
      <label>Nombre<input id="nom" placeholder="Nombre del cliente" autocomplete="off" ></label>
      <div class="lb">Plan</div><div id="plan" class="chips"></div>
      <label>Observación<select id="obs"></select></label>
      <input id="obs2" placeholder="Escribe el detalle" maxlength="100" hidden>
      <label>Coordenadas<div class="row"><input id="coo" placeholder="-16.50000,-68.15000" ><button type="button" id="b-gps" class="btn ghost">📍 GPS</button></div></label>
      <button class="btn big" id="b-save">Guardar referido</button>
      <div class="row ed"><button type="button" id="b-cancel" class="btn ghost" hidden>Cancelar</button><button type="button" id="b-del" class="btn danger ad" hidden>Eliminar</button></div>
    </form>
  </section>

  <section id="v-list" class="view">
    <div id="pq"></div>
    <div class="filters"><input id="q" type="search" placeholder="Buscar nombre o celular">
      <div class="row"><select id="fo"></select><select id="fp"></select></div><select id="fv" class="ad"></select>
      <select id="fd"><option value="todas">📅 Todas las fechas</option><option value="hoy">Hoy</option><option value="semana">Esta semana (desde el lunes)</option><option value="mes">Este mes</option><option value="rango">Rango de fechas…</option></select>
      <div id="rango" class="row" hidden><label>Desde<input type="date" id="d1"></label><label>Hasta<input type="date" id="d2"></label></div></div>
    <div id="l-count" class="muted"></div><div id="cards"></div>
  </section>

  <section id="v-stats" class="view">
    <div class="row"><select id="per"><option value="hoy">Hoy</option><option value="7">Últimos 7 días</option><option value="mes" selected>Este mes</option><option value="todo">Todo</option></select><select id="sv" class="ad"></select></div>
    <div id="kpis" class="kpis"></div>
    <div class="grid">
      <div class="card"><h3>Estado de observaciones</h3><div class="ch"><canvas id="c-obs"></canvas></div></div>
      <div class="card"><h3>Registros últimos 30 días</h3><div class="ch"><canvas id="c-dia"></canvas></div></div>
      <div class="card"><h3>Registros por plan</h3><div class="ch"><canvas id="c-plan"></canvas></div></div>
      <div class="card ad" id="w-ven"><h3>Rendimiento por vendedor</h3><div class="ch"><canvas id="c-ven"></canvas></div><div id="rk" class="rk"></div></div>
    </div>
  </section>
</main>
<nav><button data-v="reg" class="on"><span>➕</span>Registrar</button><button data-v="list"><span>📋</span><i id="n-list">Mis referidos</i></button><button data-v="stats"><span>📊</span>Estadísticas</button></nav>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="app.js"></script>
</body></html>
